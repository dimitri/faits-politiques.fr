name: seed-ci-dump

# Amorce ponctuelle du cache ci-dump-* que build-pr (.github/workflows/
# build.yml) restaure : récupère le périmètre CI depuis l'actif d'une
# release GitHub plutôt que de le produire ici (un ingest complet ne tient
# pas dans le budget d'un runner hébergé — voir docs/ci-pipeline.md § 1,
# et c'est précisément pour ça que build-pr existe). build-full republiera
# un cache frais lui-même dès qu'un run complet y arrive ; celui-ci
# n'existe que pour sortir build-pr de l'impasse tant qu'aucun run de ce
# genre n'a encore abouti sur ce dépôt.
#
# Jamais automatique (pas de schedule/push) : déclenché à la main, une
# fois, par quelqu'un qui vient de publier la release source.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release portant l'actif ci.dump"
        required: true
        default: ci-dump-seed-1

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer ci.dump depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern ci.dump --clobber

      - name: Vérifier l'archive avant de la publier
        run: pg_restore --list ci.dump > /dev/null

      - name: Publier le périmètre CI en cache
        uses: actions/cache/save@v4
        with:
          path: ci.dump
          key: ci-dump-${{ github.run_id }}
