name: build

on:
  schedule:
    - cron: '0 5 * * *'     # les scrutins sont publiés au fil des séances
  workflow_dispatch:
    inputs:
      seed_ci_dump_release:
        description: >-
          Amorce ci-dump depuis l'actif ci.dump d'une release GitHub, au
          lieu de lancer build-full/build-pr — tag de la release (laisser
          vide pour un run normal). Voir le job seed-ci-dump plus bas.
        required: false
        default: ""
  pull_request:             # job léger : périmètre CI en cache, pas d'ingestion
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # Amorce ponctuelle du cache ci-dump-* que build-pr restaure : seulement
  # quand seed_ci_dump_release est renseigné. Casse le chicken-and-egg où
  # build-pr a besoin d'un cache que seul build-full publie, et où
  # build-full a besoin d'un ingest complet qui ne tient pas dans le budget
  # d'un runner hébergé (docs/ci-pipeline.md § 1) — tant qu'aucun run de ce
  # genre n'a encore abouti sur ce dépôt, rien ne peut sinon jamais amorcer
  # le cache. Le fichier vient d'un export (fpctl dump ci) produit hors
  # CI, attaché en tant qu'actif à une release créée pour l'occasion.
  seed-ci-dump:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_ci_dump_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write, pas read : l'API GitHub ne rend une release en
    # brouillon qu'à un jeton ayant un accès équivalent à push sur le
    # dépôt — rien n'est pourtant écrit ici, seulement lu.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      # gh release download résout par tag via l'endpoint GET .../releases/
      # tags/{tag}, qui exclut les releases en brouillon — la nôtre en est
      # une, volontairement (jamais un dump publié comme s'il faisait
      # référence). Listée puis filtrée via /releases à la place, qui les
      # inclut toutes.
      - name: Récupérer ci.dump depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            -q '.[] | select(.tag_name=="${{ inputs.seed_ci_dump_release }}") | .assets[] | select(.name=="ci.dump") | .url')
          if [ -z "$url" ]; then
            echo "aucun actif ci.dump trouvé sur la release ${{ inputs.seed_ci_dump_release }}" >&2
            exit 1
          fi
          gh api "$url" -H "Accept: application/octet-stream" > ci.dump

      - name: Vérifier l'archive avant de la publier
        run: pg_restore --list ci.dump > /dev/null

      - name: Publier le périmètre CI en cache
        uses: actions/cache/save@v4
        with:
          path: ci.dump
          key: ci-dump-${{ github.run_id }}

  # Job lourd : ingestion complète (~100 connecteurs), les deux portes de
  # qualité, construction du site, puis export du périmètre CI (schéma mv +
  # TablesDirectes, voir cmd/fpctl/man/fpctl-dump.md) pour que build-pr
  # puisse construire sans tout réingérer. Jamais sur pull_request — voir
  # docs/ci-pipeline.md § 3.5 : la latence de retour sur une PR ne doit pas
  # dépendre du temps d'ingestion (1h22 cumulées, INFRA.md § 1), alors que
  # l'essentiel des PR touche le rendu du site, pas les connecteurs.
  #
  # Jamais sur schedule non plus, pour une raison différente : ingest all
  # ne tient structurellement pas dans le budget (temps, disque) d'un
  # runner hébergé — docs/ci-pipeline.md § 1 conclut qu'une VM dédiée est
  # nécessaire, pas encore provisionnée. Tant que ce job n'a jamais abouti
  # une seule fois ici (vérifié : chaque tentative est soit annulée après
  # ~45 min, soit tuée par le disque), le laisser tourner chaque nuit ne
  # produit qu'un échec garanti et un jeu de notifications pour rien.
  # build-pr (schedule y est inclus, plus bas) couvre chaque nuit ce qui
  # est réellement vérifiable sans cette VM : que le site se construit
  # encore depuis le dernier périmètre CI connu.
  build-full:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.seed_ci_dump_release == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Pas de services: ici. Le mécanisme services: de GitHub Actions ne sait
    # que tirer une image publiée telle quelle — il ne peut pas construire
    # docker/postgres.Dockerfile, qui ajoute PostGIS, pgvector, rum et
    # unaccent à l'image officielle. Un postgres:17 nu (ce que faisait ce
    # fichier jusqu'ici) échoue dès la migration 0058 (« extension "postgis"
    # is not available »). fpctl provision db (docker compose) construit et
    # démarre la même image que le développement local — voir
    # docker-compose.yml.
    env:
      DATABASE_URL: postgres://fp:fp@localhost:55432/fp?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Interdire le DELETE+COPY direct dans un connecteur
        run: ./scripts/check-delete-copy.sh

      - name: Compiler fpctl
        run: go build -o bin/fpctl ./cmd/fpctl

      # pg_dump refuse de dumper un serveur plus récent que lui (« aborting
      # because of server version mismatch ») — le client par défaut de ce
      # runner ne colle pas forcément à la version 17 du serveur que fpctl
      # provision db démarre.
      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      - name: Provisionner Postgres
        run: ./bin/fpctl provision db

      # Les documents scellés sont conservés entre deux exécutions : l'archive
      # est immuable et adressée par empreinte, un document déjà vu n'est pas
      # retéléchargé. Seule une nouvelle récupération est enregistrée.
      - name: Restaurer l'archive scellée
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Ingestion
        run: ./bin/fpctl ingest all

      # Porte 1 : les garanties structurelles tournent sur la base RÉELLEMENT
      # chargée, pas sur une base vide. Une donnée qui violerait une règle
      # éditoriale bloque la publication.
      - name: Garanties structurelles
        run: |
          fail=0
          for f in db/tests/*.sql; do
            out=$(psql -v ON_ERROR_STOP=1 -d "$DATABASE_URL" -f "$f" 2>&1) || fail=1
            echo "$out" | grep -E 'NOTICE|ERROR'
            echo "$out" | grep -q 'ERROR' && fail=1
          done
          exit $fail

      # Porte 2 : cohérence des données chargées avec les décomptes officiels.
      - name: Concordance avec les décomptes officiels
        run: ./bin/fpctl verify data

      - name: Génération du site
        run: ./bin/fpctl build site

      - name: Taille produite
        run: |
          echo "pages : $(find site -name '*.html' | wc -l)"
          echo "poids : $(du -sh site | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

      # Périmètre CI (mv + TablesDirectes) pour build-pr : voir
      # cmd/fpctl/man/fpctl-dump.md. En cache plutôt qu'uploadé vers un
      # object storage — aucune clé S3 n'est encore provisionnée sur ce
      # dépôt (docs/decisions.md D-012, hébergement pas encore tranché) ;
      # -upload/-download restent l'option à basculer le jour où ça l'est,
      # sans changer la logique ci-dessous.
      - name: Exporter le périmètre CI (mv + TablesDirectes)
        run: ./bin/fpctl dump ci -out ci.dump

      # Clé toujours neuve (run_id) : chaque run publie sa propre entrée,
      # jamais un cache-hit qui sauterait la sauvegarde. build-pr retrouve
      # la plus récente par restore-keys.
      - name: Publier le périmètre CI en cache
        uses: actions/cache/save@v4
        with:
          path: ci.dump
          key: ci-dump-${{ github.run_id }}

      # Le déploiement n'a lieu que sur la branche principale : une pull request
      # produit un site complet, consultable, mais non publié.
      - name: Déploiement
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "cible d'hébergement à trancher — voir docs/decisions.md D-012"

  # Job léger : pas d'ingestion, pas de connecteurs — le site est construit
  # à partir du dernier périmètre CI publié par build-full (push main) ou,
  # faute de cache visible depuis cette ref, de la release d'amorçage (voir
  # plus bas). Répond en quelques minutes plutôt qu'en heures, au prix de
  # ne pas rejouer les garanties structurelles ni la concordance avec les
  # décomptes officiels (elles ont besoin de core/ref, hors du périmètre) —
  # ces deux portes restent couvertes par build-full, seulement à chaque
  # push sur main désormais (schedule ne l'exécute plus, voir plus haut).
  #
  # schedule tourne CE job, pas build-full : la seule chose qu'une nuit
  # sans intervention humaine peut réellement vérifier aujourd'hui est que
  # le site se construit encore depuis le dernier périmètre CI connu — pas
  # qu'un ingest complet aboutisse, ce qu'aucun run n'a jamais fait ici.
  build-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write, pas read : nécessaire au repli sur la release
    # d'amorçage plus bas (même raison que seed-ci-dump), quand le cache
    # n'a rien à offrir.
    permissions:
      contents: write

    env:
      DATABASE_URL: postgres://fp:fp@localhost:55432/fp?sslmode=disable
      # Repli quand le cache ci-dump-* est absent ou invisible depuis cette
      # ref (une pull_request tourne sur refs/pull/<n>/merge, hors de la
      # portée de visibilité du cache de refs/heads/<branche> qui l'a
      # publié — constaté, pas simplement documenté) : la dernière release
      # d'amorçage connue plutôt qu'un échec dur. À remettre à jour quand
      # un vrai run de build-full aura fini par aboutir et que son propre
      # cache sera visible depuis les PR sans ce détour.
      CI_DUMP_FALLBACK_RELEASE: ci-dump-seed-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Interdire le DELETE+COPY direct dans un connecteur
        run: ./scripts/check-delete-copy.sh

      - name: Compiler fpctl
        run: go build -o bin/fpctl ./cmd/fpctl

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      # pg_restore refuse un format d'archive plus récent que ce qu'il
      # connaît — même raison que dans build-full : coller à la version du
      # serveur (17), pas au client par défaut du runner.
      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      - name: Provisionner Postgres
        run: ./bin/fpctl provision db

      # restore-keys (sans clé exacte) retrouve la plus récente entrée
      # ci-dump-* publiée par build-full — jamais celle de cette PR, qui
      # n'en produit pas.
      - name: Restaurer le dernier périmètre CI publié
        uses: actions/cache/restore@v4
        with:
          path: ci.dump
          key: ci-dump-jamais-cette-cle
          restore-keys: ci-dump-

      # Repli sur la release d'amorçage, même mécanisme que seed-ci-dump :
      # seulement si le cache n'a rien restauré.
      - name: Repli sur la release d'amorçage si le cache est vide
        if: hashFiles('ci.dump') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            -q ".[] | select(.tag_name==\"$CI_DUMP_FALLBACK_RELEASE\") | .assets[] | select(.name==\"ci.dump\") | .url")
          if [ -z "$url" ]; then
            echo "aucun périmètre CI en cache, et aucun actif ci.dump sur la release $CI_DUMP_FALLBACK_RELEASE" >&2
            exit 1
          fi
          gh api "$url" -H "Accept: application/octet-stream" > ci.dump

      - name: Vérifier qu'un périmètre CI est disponible
        run: |
          if [ ! -f ci.dump ]; then
            echo "Aucun périmètre CI disponible, ni en cache ni via la release d'amorçage." >&2
            exit 1
          fi

      - name: Restaurer le périmètre CI dans Postgres
        run: ./bin/fpctl dump restore -fichier ci.dump

      - name: Génération du site
        run: ./bin/fpctl build site

      - name: Taille produite
        run: |
          echo "pages : $(find site -name '*.html' | wc -l)"
          echo "poids : $(du -sh site | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: site-pr
          path: site/
          retention-days: 7
