name: build

on:
  schedule:
    - cron: '0 5 * * *'     # les scrutins sont publiés au fil des séances
  workflow_dispatch:
    inputs:
      seed_ci_dump_release:
        description: >-
          Amorce ci-dump depuis l'actif ci.dump d'une release GitHub, au
          lieu de lancer build-full/build-pr — tag de la release (laisser
          vide pour un run normal). Voir le job seed-ci-dump plus bas.
        required: false
        default: ""
  pull_request:             # job léger : périmètre CI en cache, pas d'ingestion
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # Amorce ponctuelle du cache ci-dump-* que build-pr restaure : seulement
  # quand seed_ci_dump_release est renseigné. Casse le chicken-and-egg où
  # build-pr a besoin d'un cache que seul build-full publie, et où
  # build-full a besoin d'un ingest complet qui ne tient pas dans le budget
  # d'un runner hébergé (docs/ci-pipeline.md § 1) — tant qu'aucun run de ce
  # genre n'a encore abouti sur ce dépôt, rien ne peut sinon jamais amorcer
  # le cache. Le fichier vient d'un export (fpctl dump ci) produit hors
  # CI, attaché en tant qu'actif à une release créée pour l'occasion.
  seed-ci-dump:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_ci_dump_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write, pas read : l'API GitHub ne rend une release en
    # brouillon qu'à un jeton ayant un accès équivalent à push sur le
    # dépôt — rien n'est pourtant écrit ici, seulement lu.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      # gh release download résout par tag via l'endpoint GET .../releases/
      # tags/{tag}, qui exclut les releases en brouillon — la nôtre en est
      # une, volontairement (jamais un dump publié comme s'il faisait
      # référence). Listée puis filtrée via /releases à la place, qui les
      # inclut toutes.
      - name: Récupérer ci.dump depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            -q '.[] | select(.tag_name=="${{ inputs.seed_ci_dump_release }}") | .assets[] | select(.name=="ci.dump") | .url')
          if [ -z "$url" ]; then
            echo "aucun actif ci.dump trouvé sur la release ${{ inputs.seed_ci_dump_release }}" >&2
            exit 1
          fi
          gh api "$url" -H "Accept: application/octet-stream" > ci.dump

      - name: Vérifier l'archive avant de la publier
        run: pg_restore --list ci.dump > /dev/null

      - name: Publier le périmètre CI en cache
        uses: actions/cache/save@v4
        with:
          path: ci.dump
          key: ci-dump-${{ github.run_id }}

  # Job lourd : ingestion complète (~100 connecteurs), les deux portes de
  # qualité, construction du site, puis export du périmètre CI (schéma mv +
  # TablesDirectes, voir cmd/fpctl/man/fpctl-dump.md) pour que build-pr
  # puisse construire sans tout réingérer. Jamais sur pull_request — voir
  # docs/ci-pipeline.md § 3.5 : la latence de retour sur une PR ne doit pas
  # dépendre du temps d'ingestion (1h22 cumulées, INFRA.md § 1), alors que
  # l'essentiel des PR touche le rendu du site, pas les connecteurs.
  #
  # Runner auto-hébergé (dev-runner), pas ubuntu-latest : un runner hébergé,
  # plafonné à 45 min par ce fichier et à 14 Go de disque, ne pouvait
  # structurellement pas aboutir — les runs programmés ont été vus annulés
  # pile au timeout, répétés jour après jour, jusqu'à ce qu'une passe de
  # concurrence (internal/pipeline, PrefetchAll, chaîne communes-* fusionnée
  # au graphe — voir git log de ce fichier) ramène l'ingestion complète sous
  # la barre des 20 minutes, cumulée à la génération du site. Le schedule
  # nocturne, désactivé un temps pour build-full (ce job n'avait alors
  # jamais abouti ici une seule fois), est donc réactivé ci-dessous : la
  # raison de l'avoir coupé ne tient plus. INFRA.md § 10 posait déjà les
  # conditions d'un runner auto-hébergé pour ce dépôt PUBLIC avant de
  # l'installer — toutes vérifiées ici : jamais de déclenchement sur
  # pull_request (voir le if: ci-dessous), conteneur Docker isolé du reste
  # de la machine (le même démon docker-ci que les autres dépôts construits
  # sur dev-runner, DOCKER_HOST fixé par le service systemd du runner, pas
  # par ce fichier), et aucun secret durable propre à ce workflow (aucun
  # n'existe encore ici).
  build-full:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.seed_ci_dump_release == '')
    runs-on: [self-hosted, faits-politiques]
    # Un filet de sécurité, pas un budget serré comme sur ubuntu-latest : le
    # runner auto-hébergé n'a plus de plafond de 45 min ni de 14 Go, mais un
    # connecteur qui boucle pour de vrai doit quand même finir par échouer
    # plutôt que tourner indéfiniment sur une machine partagée avec d'autres
    # dépôts.
    timeout-minutes: 180

    # Pas de services: ici. Le mécanisme services: de GitHub Actions ne sait
    # que tirer une image publiée telle quelle — il ne peut pas construire
    # docker/postgres.Dockerfile, qui ajoute PostGIS, pgvector, rum et
    # unaccent à l'image officielle. Un postgres:17 nu (ce que faisait ce
    # fichier jusqu'ici) échoue dès la migration 0058 (« extension "postgis"
    # is not available »). fpctl provision db (docker compose) construit et
    # démarre la même image que le développement local — voir
    # docker-compose.yml.
    env:
      # Port décalé (docker-compose.yml, FP_DB_PORT) : dev-runner fait déjà
      # tourner un Postgres de développement sur 55432 (démon Docker par
      # défaut, deux semaines d'uptime) — le même port hôte sur le démon
      # docker-ci isolé de ce runner entrerait en collision dessus, constaté
      # en pratique (« address already in use ») avant ce décalage.
      FP_DB_PORT: "55433"
      DATABASE_URL: postgres://fp:fp@localhost:55433/fp?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Interdire le DELETE+COPY direct dans un connecteur
        run: ./scripts/check-delete-copy.sh

      - name: Compiler fpctl
        run: go build -o bin/fpctl ./cmd/fpctl

      # pg_dump refuse de dumper un serveur plus récent que lui (« aborting
      # because of server version mismatch ») — le client par défaut de ce
      # runner ne colle pas forcément à la version 17 du serveur que fpctl
      # provision db démarre.
      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      - name: Provisionner Postgres
        run: ./bin/fpctl provision db

      # Les documents scellés sont conservés entre deux exécutions : l'archive
      # est immuable et adressée par empreinte, un document déjà vu n'est pas
      # retéléchargé. Seule une nouvelle récupération est enregistrée.
      - name: Restaurer l'archive scellée
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # -j 32 : la quasi-totalité du catalogue (runToutSupplement) n'a aucune
      # dépendance déclarée entre connecteurs — la machinerie de vagues
      # concurrentes existe déjà (internal/pipeline.Registre, le même
      # mécanisme que fpctl build site et les matvues) et n'attendait qu'un
      # -j réel pour servir à l'ingestion. dev-runner n'a que 24 cœurs, mais
      # ce travail est dominé par l'attente réseau (téléchargements,
      # requêtes HTTP) plutôt que par le calcul : 32 goroutines peuvent
      # attendre leur tour de front sans se disputer un cœur. an-exposes,
      # lui, reste plafonné à sa propre limite de 5 (internal/an/exposes.go,
      # une politesse par connexion envers un site public, pas une API) quel
      # que soit -j ici ; aucun autre connecteur ne vise le même site en
      # masse, donc élargir -j au-delà de 8 ne fait que mieux recouvrir les
      # dizaines de connecteurs qui, eux, n'ont pas cette limite. Le pool
      # Postgres de ce même run s'élargit en conséquence (voir
      # concurrenceDuPool, internal/ingest/ingest.go) — largement sous les
      # 100 connexions par défaut de Postgres, même cumulé aux 8 de
      # l'actualisation des matvues (internal/ingest/ingest.go,
      # actualiserMatviews) qui suit juste après.
      - name: Ingestion
        run: ./bin/fpctl ingest default -j 32

      # Diagnostic de la chaîne CHES -> groupe -> votes, posé après une
      # panne non reproduite en local (run 38046899924 et les nuits
      # suivantes : "un score gauche-droite est joignable aux votes" tombe
      # à 0, alors qu'un ingest from scratch identique, en local, donne 9 —
      # chaque maillon (party_group_link, party_referential_link CHES,
      # party_classification lrgen, ballot.organization_id par groupe)
      # compte juste avant que verify ne pose la même question en un seul
      # nombre. Toujours affiché, pas seulement sur échec : utile aussi pour
      # voir une nuit qui passe se dégrader progressivement plutôt que de
      # basculer d'un coup.
      - name: Diagnostic cartographie CHES -> groupes -> votes
        run: |
          psql -d "$DATABASE_URL" -c "
          SELECT 'party_group_link' AS table, count(*) FROM core.party_group_link
          UNION ALL
          SELECT 'party_referential_link (CHES)', count(*) FROM core.party_referential_link WHERE scheme = 'CHES'
          UNION ALL
          SELECT 'party_classification (CHES, lrgen)', count(*)
            FROM core.party_classification pc
            JOIN ref.classification_set s ON s.id = pc.classification_set_id
           WHERE s.provider = 'CHES' AND pc.dimension = 'lrgen';
          "
          psql -d "$DATABASE_URL" -c "
          SELECT g.id, g.name,
                 (SELECT count(*) FROM core.ballot b WHERE b.organization_id = g.id) AS n_ballots
            FROM core.party_group_link pgl
            JOIN core.organization g ON g.id = pgl.group_id
           ORDER BY g.id;
          "

      # Porte 1 : les garanties structurelles tournent sur la base RÉELLEMENT
      # chargée, pas sur une base vide. Une donnée qui violerait une règle
      # éditoriale bloque la publication.
      - name: Garanties structurelles
        run: |
          fail=0
          for f in db/tests/*.sql; do
            out=$(psql -v ON_ERROR_STOP=1 -d "$DATABASE_URL" -f "$f" 2>&1) || fail=1
            echo "$out" | grep -E 'NOTICE|ERROR'
            echo "$out" | grep -q 'ERROR' && fail=1
          done
          exit $fail

      # Porte 2 : cohérence des données chargées avec les décomptes officiels.
      - name: Concordance avec les décomptes officiels
        run: ./bin/fpctl verify data

      - name: Génération du site
        run: ./bin/fpctl build site

      - name: Taille produite
        run: |
          echo "pages : $(find site -name '*.html' | wc -l)"
          echo "poids : $(du -sh site | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

      # Périmètre CI (mv + TablesDirectes) pour build-pr : voir
      # cmd/fpctl/man/fpctl-dump.md. En cache plutôt qu'uploadé vers un
      # object storage — aucune clé S3 n'est encore provisionnée sur ce
      # dépôt (docs/decisions.md D-012, hébergement pas encore tranché) ;
      # -upload/-download restent l'option à basculer le jour où ça l'est,
      # sans changer la logique ci-dessous.
      - name: Exporter le périmètre CI (mv + TablesDirectes)
        run: ./bin/fpctl dump ci -out ci.dump

      # Clé toujours neuve (run_id) : chaque run publie sa propre entrée,
      # jamais un cache-hit qui sauterait la sauvegarde. build-pr retrouve
      # la plus récente par restore-keys.
      - name: Publier le périmètre CI en cache
        uses: actions/cache/save@v4
        with:
          path: ci.dump
          key: ci-dump-${{ github.run_id }}

      # Récupérable depuis n'importe quel run de ce job, sans avoir à
      # relancer fpctl dump ci en local : rafraîchir la release d'amorçage
      # (seed-ci-dump plus haut, CI_DUMP_FALLBACK_RELEASE de build-pr) se
      # fait en téléchargeant cet artefact puis en remplaçant son actif,
      # jamais en réexportant à la main depuis une base de développement.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-dump
          path: ci.dump
          retention-days: 7

      # Le déploiement n'a lieu que sur la branche principale : une pull request
      # produit un site complet, consultable, mais non publié.
      - name: Déploiement
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "cible d'hébergement à trancher — voir docs/decisions.md D-012"

  # Job léger : pas d'ingestion, pas de connecteurs — le site est construit
  # à partir du dernier périmètre CI publié par build-full (push main ou
  # schedule désormais, voir plus haut) ou, faute de cache visible depuis
  # cette ref, de la release d'amorçage (voir plus bas). Répond en quelques
  # minutes plutôt qu'en heures, au prix de ne pas rejouer les garanties
  # structurelles ni la concordance avec les décomptes officiels (elles ont
  # besoin de core/ref, hors du périmètre) — ces deux portes restent
  # couvertes par build-full à chaque push sur main ET chaque nuit.
  #
  # schedule ne tourne plus CE job en plus de build-full : du temps où
  # build-full n'aboutissait jamais sur runner hébergé, ce job couvrait seul
  # la nuit (vérifier que le site se construit encore depuis le dernier
  # périmètre CI connu) — un stand-in, pas une des deux portes de qualité.
  # build-full couvre maintenant les deux chaque nuit ; le garder ici aussi
  # n'ajoutait qu'une exécution redondante du même plus petit dénominateur.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write, pas read : nécessaire au repli sur la release
    # d'amorçage plus bas (même raison que seed-ci-dump), quand le cache
    # n'a rien à offrir.
    permissions:
      contents: write

    env:
      DATABASE_URL: postgres://fp:fp@localhost:55432/fp?sslmode=disable
      # Repli quand le cache ci-dump-* est absent ou invisible depuis cette
      # ref (une pull_request tourne sur refs/pull/<n>/merge, hors de la
      # portée de visibilité du cache de refs/heads/<branche> qui l'a
      # publié — constaté, pas simplement documenté) : la dernière release
      # d'amorçage connue plutôt qu'un échec dur. À remettre à jour quand
      # un vrai run de build-full aura fini par aboutir et que son propre
      # cache sera visible depuis les PR sans ce détour.
      CI_DUMP_FALLBACK_RELEASE: ci-dump-seed-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Interdire le DELETE+COPY direct dans un connecteur
        run: ./scripts/check-delete-copy.sh

      - name: Compiler fpctl
        run: go build -o bin/fpctl ./cmd/fpctl

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      # pg_restore refuse un format d'archive plus récent que ce qu'il
      # connaît — même raison que dans build-full : coller à la version du
      # serveur (17), pas au client par défaut du runner.
      - name: Installer les clients PostgreSQL 17
        run: ./scripts/install-pg-client.sh

      - name: Provisionner Postgres
        run: ./bin/fpctl provision db

      # restore-keys (sans clé exacte) retrouve la plus récente entrée
      # ci-dump-* publiée par build-full — jamais celle de cette PR, qui
      # n'en produit pas.
      - name: Restaurer le dernier périmètre CI publié
        uses: actions/cache/restore@v4
        with:
          path: ci.dump
          key: ci-dump-jamais-cette-cle
          restore-keys: ci-dump-

      # Repli sur la release d'amorçage, même mécanisme que seed-ci-dump :
      # seulement si le cache n'a rien restauré.
      - name: Repli sur la release d'amorçage si le cache est vide
        if: hashFiles('ci.dump') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            -q ".[] | select(.tag_name==\"$CI_DUMP_FALLBACK_RELEASE\") | .assets[] | select(.name==\"ci.dump\") | .url")
          if [ -z "$url" ]; then
            echo "aucun périmètre CI en cache, et aucun actif ci.dump sur la release $CI_DUMP_FALLBACK_RELEASE" >&2
            exit 1
          fi
          gh api "$url" -H "Accept: application/octet-stream" > ci.dump

      - name: Vérifier qu'un périmètre CI est disponible
        run: |
          if [ ! -f ci.dump ]; then
            echo "Aucun périmètre CI disponible, ni en cache ni via la release d'amorçage." >&2
            exit 1
          fi

      - name: Restaurer le périmètre CI dans Postgres
        run: ./bin/fpctl dump restore -fichier ci.dump

      - name: Génération du site
        run: ./bin/fpctl build site

      - name: Taille produite
        run: |
          echo "pages : $(find site -name '*.html' | wc -l)"
          echo "poids : $(du -sh site | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: site-pr
          path: site/
          retention-days: 7
