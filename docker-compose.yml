services:
  db:
    # PostGIS, et non postgres nu : les contours administratifs (geo.contour)
    # sont dessinés par la base elle-même, en SVG, sans bibliothèque de carto ni
    # serveur de tuiles. Même base Alpine et même version majeure que l'image
    # précédente : le volume de données reste valable.
    image: postgis/postgis:17-3.5-alpine
    container_name: fp_db
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: fp
    ports: ["55432:5432"]
    volumes: ["fp_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d fp"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  fp_pgdata:
