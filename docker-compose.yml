services:
  db:
    # Notre propre image, parce qu'aucune image publiée ne réunit les quatre
    # extensions dont ce projet a besoin : postgis (les contours administratifs
    # sont dessinés par la base elle-même, en SVG, sans bibliothèque de carto ni
    # serveur de tuiles), vector (recherche par voisinage dans le corpus du
    # Journal officiel), rum (recherche de phrase et classement avec les
    # positions dans l'index) et unaccent (la configuration de recherche `fr`).
    # postgis/postgis n'a ni pgvector ni rum ; pgvector/pgvector n'a pas PostGIS.
    # Voir docker/postgres.Dockerfile.
    #
    # ATTENTION AU VOLUME. L'image précédente était Alpine, donc musl ; celle-ci
    # est Debian, donc glibc. Les collations diffèrent, donc l'ORDRE DES INDEX
    # diffère : le répertoire de données de l'une n'est pas valable pour
    # l'autre. Le passage se fait par `make db-dump` puis `make db-restore`,
    # jamais en réutilisant le volume.
    image: faits-politiques/postgres:17
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      args:
        POSTGRES_VERSION: "17"
    # pg_stat_statements doit être préchargé au démarrage du serveur : c'est la
    # seule façon d'observer la charge réelle d'une base qu'on interroge en
    # plein texte sur un corpus d'un million d'actes.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    container_name: fp_db
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: fp
    ports: ["55432:5432"]
    volumes:
      # UN VOLUME NEUF, et non `fp_pgdata`. Ce dernier a été initialisé par
      # l'ancienne image Alpine — musl — et ses index de texte sont rangés selon
      # les collations de musl. Démarrer cette image-ci (glibc) dessus
      # fonctionnerait en apparence et rendrait des résultats faux, sans erreur.
      #
      # L'ancien volume n'est PAS supprimé : il reste sur le disque comme retour
      # arrière, tant que la base neuve n'a pas fait ses preuves. Le supprimer
      # est une décision à prendre plus tard, explicitement :
      #   docker volume rm faits-politiquesfr_fp_pgdata
      - "fp_pgdata_debian:/var/lib/postgresql/data"
      # Les sauvegardes sont montées en lecture seule plutôt que recopiées dans
      # le conteneur : `pg_restore -j` a besoin d'un FICHIER — il ne sait pas
      # paralléliser depuis un tube — et recopier 1,3 Go pour le lire une fois
      # est du temps perdu.
      - "./db/dump:/dump:ro"
    healthcheck:
      # -h 127.0.0.1 et -p 5432 explicites : le contrôle doit viser le serveur
      # lancé sur $PGDATA, et rien d'autre. Le premier démarrage de l'image
      # Debian l'a appris à ses dépens — pg_isready passait par le pg_wrapper et
      # interrogeait le port 5433 d'un cluster Debian inutilisé.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U fp -d fp"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Le premier démarrage d'un volume neuf lance initdb puis crée dix
      # extensions, PostGIS comprise : plus d'une minute. Sans période de grâce,
      # `docker compose up --wait` déclarait le conteneur défaillant pendant
      # qu'il s'initialisait normalement.
      start_period: 180s
  # Object store local, compatible S3 — sert à deux choses distinctes :
  # l'archive scellée (fp-archive, voir internal/archive) et, pour évaluer si
  # servir le site depuis un object storage a du sens, une copie du site
  # généré (fp-site). Un seul conteneur, deux buckets, comme la production
  # n'en aurait besoin que d'un des deux le jour où elle en aurait besoin.
  minio:
    image: minio/minio:latest
    container_name: fp_minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: fpminio
      MINIO_ROOT_PASSWORD: fp12345678
    ports:
      - "9090:9000"   # API S3
      - "9091:9091"   # console web
    volumes:
      - "fp_minio_data:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  fp_pgdata_debian:
  fp_minio_data:
